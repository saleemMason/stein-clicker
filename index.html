<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stein Clicker</title>

    <style>
        img{
            border-radius: 50;
        }
        
        body {
            background-color: black;
            color: green;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 { color: green; }
        p  { font-style: italic; color: green; }

        #clicker {
            cursor: pointer;
            padding: 0;
            background: none;
            border: none;
            transition: transform 0.1s ease;
        }

        #clicker img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            max-width: 80vw;
            display: block;
            border-radius: 50%;
            transition: transform 0.4s ease;
        }


        #clicker:focus-visible { outline: 3px solid green; outline-offset: 6px; }

        #count {
            font-size: 5rem;
            margin: 0.5rem 0;
        }

        #upgrade {
            background-color: black;
            color: lime;
            border: 2px solid green;
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #upgrade:hover{
            background-color: darkgreen;
        }


        #autoclick {
            background-color: black;
            color:lime;
            border:2px solid green;
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #autoclick:hover{
            background-color: darkgreen;
        }

        .brain{
            position:fixed;
            font-size: 32px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: float-up 0.8s ease-out forwards;
        }

        #rouletteMini{
            position:fixed;
            right: 20px;
            top: 40px;
            background:none;
            border: 2px solid green;
            border-radius: 50%;
            cursor:pointer;
            padding: 8px;
        }

        #roulettePanel {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            max-width: 95vw;
            max-height: 95vh;
            overflow:auto;
            box-sizing: border-box;
            background-color: black;
            border: 2px solid green;
            padding: 10px;
            z-index: 5000;
        }

        #roulettePanel input {
            width: 90px;
            background:black;
            color:lime;
            border: 2px solid green;
            padding: 6px;
            font-size: 16px;
        }

        #roulettePanel button{
            background: black;
            color:lime;
            border: 2px solid green;
            padding: 6px 10px;
            cursor: pointer;
        }

        #roulettePanel button:hover { background-color: darkgreen; }

        #wheelGroup {
            transform-origin: 0 0;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pocket{ cursor: pointer; stroke: #222; stroke-width: 1 ; }
        .pocket.selected { stroke: yellow; stroke-width: 4; }

    @keyframes float-up {
        from{ opacity: 1; margin-top: 0; }
        to {opacity: 0; margin-top: -60px; }
    }

        #coinMini {
            position:fixed;
            right: 20px;
            top: 150px;
            font-size: 28px;
            background: none;
            border: 2px solid green;
            border-radius: 50%;
            cursor: pointer;
            padding: 8px;
        }

        #coinPanel{
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform:translate(-50%, -50%);
            width: 340px;
            max-width: 95vw;
            box-sizing: border-box;
            background: black;
            border: 2px solid green;
            padding: 10px;
            z-index: 5000;
        }

        #coinPanel input {
            width: 90px;
            background:black;
            color: lime;
            border: 2px solid green;
            padding: 6px;
            font-size: 16px;
        }

        #coinPanel button{
            background: black;
            color:lime;
            border: 2px solid green;
            padding: 6px 10px;
            cursor: pointer;
        }

        #coinPanel button:hover,
        #coinPanel button.active { background-color: darkgreen;}

        #coinPanel button.active { border-color: yellow;}

        #coin {
            display: inline-block;
            font-size: 80px;
            margin: 15px 0;
        }

        #roulettePanel button[data-color="red"] { color:red; border-color:red;}
        #roulettePanel button[data-color="red"]:hover,
        #roulettePanel button[data-color="red"].active { color: black; background-color: red;}

        #roulettePanel button[data-color="black"] { color:white; border-color:white;}
        #roulettePanel button[data-color="black"]:hover,
        #roulettePanel button[data-color="black"].active { color: black; background-color: white;}

        #roulettePanel button[data-color="green"] { color:lime; border-color: lime;}
        #roulettePanel button[data-color="green"]:hover,
        #roulettePanel button[data-color="green"].active {color: black; background-color: lime;}
        
    </style>
</head>

<body>
    <h1>Stein clicker</h1>

    <p id="count">0</p>
    <p>clicks</p>

    <!--upgrade button-->
    <button id="upgrade" onclick="buyUpgrade()">get 2x the clicks</button>
    <button id="autoclick" onclick="buy_autoclick()">Autoclicker</button>
    <p id="message"></p>

    <!--this is the einstein you click-->
    <button id="clicker">
        <img id="einstein" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNXnNsd6HAjRGAHc33PpnQC7LfZFjI4N6OiV8tvGcMBA&s">
    </button>    
    
    <button id="rouletteMini">
        <img src="https://media.istockphoto.com/id/485660878/vector/sport-illustration.jpg?s=612x612&w=0&k=20&c=u7WciQuhqrutwio8ZeIquSiyZ1vHZhhyb0qeUb2D4A4=" width="64">
    </button>

    <div id="roulettePanel">
        <button id="rouletteClose" style="float:right;">X</button>
        <h3>Roulette</h3>

        <div>
            Bet : <input type="number" id="betAmount" min="1" value="10">
            <button data-add="10">+10</button>
            <button data-add="100">+100</button>
            <button id="betMax">Max</button>
        </div>

        <div style="margin:8px 0;">
            <button data-color="red">Red</button>
            <button data-color="black">Black</button>
            <button data-color="green">Green</button>
        </div>

        <p id="selectedText">Click a pocket to pick it</p>

        <svg viewBox="-150 -150 300 300" width="300" height="300">
            <g id="wheelGroup"></g>
            <polygon points="-10, -150 10, -150 0, -128" fill="white"/>
            <circle id="wheelCenter" cx="0" r="60" fill="darkgreen" stroke="lime" stroke-width="3" style="cursor:pointer;"/>
            <text x="0" y="6" text-anchor="middle" fill="white" font-size="18" pointer-events="none">BET</text>
        </svg>
        <p id="rouletteMSG"></p>
    </div>

    <button id="coinMini">🪙</button>

    <div id="coinPanel">
        <button id="coinClose" style="float:right;">X</button>
        <h3>Coin Flip</h3>

        Bet: <input type="number" id="coinBet" min="1" value="10"> 



        <div style="margin: 8px 0;">
            <button data-side="brain">🧠 Brain</button>
            <button data-side="skull">💀 Skull</button>
        </div>
    
        <div id="coin">🪙</div><br>

        <button id="coinFlip">Flip</button>
        <button id="coinDouble">Double or nothing</button>
        <p id="coinMsg">Pick a side, then flip. Win doubles your bet</p>

    </div>




    
    <script>
        let rotation = 0;
        let count = 0;
        let clickPower = 1;
        let upgradeCost = 50;
        let autocost = 10;
        let autoclickers = 0;
        let selectedPocket =null;
        let wheelRot = 0;
        let spinning = false;
        let selectedColor = null;
        let coinSide= null;
        let coinFlipping = false;
        let lastWin = 0;
        const clicker = document.getElementById("clicker");
        const ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26]
        const REDS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]
        const STEP = 360 / ORDER.length;
        const SVGNS = "http://www.w3.org/2000/svg";
        const wheelGroup = document.getElementById("wheelGroup");
        const betInput = document.getElementById("betAmount");
        const rouletteMSG = document.getElementById("rouletteMSG");
        const BRAIN_CHANCE = 0.9999;

        function increaseCount() {
            count += clickPower;
            updateCount();
        }

        function upgradetext() {
            document.getElementById("upgrade").textContent =
                "double click power:" + upgradeCost + "🧠";
        }

        function buyUpgrade() {
            if (count >= upgradeCost) {
                count -= upgradeCost;
                clickPower *= 2;
                upgradeCost *= 2;
                upgradetext();

                document.getElementById("message").textContent =
                    "Upgrade purchased! Each click earns " + clickPower + "!";
            } else {
                document.getElementById("message").textContent =
                    "Not enough clicks! Keep clicking Einstein!";
            }

            updateCount();
        }

        function updateCount() {
            document.getElementById("count").textContent = count;
        }

        function spinElement() {
            rotation += 360;
            console.log("Spinning big e");
            document.getElementById("einstein").style.transform = "rotate(" + rotation + "deg)";
        }

        function add_autoclick() {
            document.getElementById("autoclick").textContent =
                "Buy auto Click (cost: " + autocost + " clicks)";
        }

        function buy_autoclick() {
            if (count >= autocost) {
                count -= autocost;
                autoclickers++;
                autocost = Math.floor(autocost * 1.15);
                updateCount();
                add_autoclick();
            } else {
                document.getElementById("message").textContent = "Not enough clicks";
            }
        }

        function beat() {
            const img = document.getElementById("clicker");
            img.style.transform = "scale(.9)";
            setTimeout(() => {
                img.style.transform = "scale(1)";
            }, 100);
        }

        setInterval(function () {
            if (autoclickers > 0) {
                count += autoclickers;
                updateCount();
                beat();
            }
        }, 1000);

        function spawnBrain() {
            const r = clicker.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;

            const angle = Math.random() * Math.PI * 2;
            const distance = 120 + Math.random() * 80;

            const brain = document.createElement("div");
            brain.className = "brain";
            brain.textContent = "🧠";
            brain.style.left = (cx + Math.cos(angle) * distance) + "px";
            brain.style.top = (cy + Math.sin(angle) * distance) + "px";
            document.body.appendChild(brain);
            setTimeout(() => brain.remove(), 900);
        }

        clicker.addEventListener("click", function () {
            increaseCount();
            spinElement();
            spawnBrain();
        });

        function pt(r, a) {
            const rad = a * Math.PI / 180;
            return (r * Math.sin(rad)).toFixed(2) + " " + (-r * Math.cos(rad)).toFixed(2);
        }

        function buildWheel() {
            ORDER.forEach((num, i) => {
                const a0 = i * STEP;
                const a1 = (i + 1) * STEP;
                const mid = a0 + STEP / 2;
                const path = document.createElementNS(SVGNS, "path");
                path.setAttribute("d",
                    `M ${pt(70, a0)} L ${pt(140, a0)} A 140 140 0 0 1 ${pt(140, a1)} L ${pt(70, a1)} A 70 70 0 0 0 ${pt(70, a0)} Z`);
                path.setAttribute("fill", num === 0 ? "green" : REDS.includes(num) ? "crimson" : "#111");
                path.setAttribute("class", "pocket");
                path.dataset.num = num;
                path.addEventListener("click", function () {
                    if (spinning) return;
                    document.querySelectorAll(".pocket").forEach(p => p.classList.remove("selected"));
                    path.classList.add("selected");
                    selectedPocket = num;
                    selectedColor = null;
                    document.getElementById("selectedText").textContent = "Selected: " + num;
                    document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));

                });
                wheelGroup.appendChild(path);

                const [tx, ty] = pt(112, mid).split(" ");
                const label = document.createElementNS(SVGNS, "text");
                label.setAttribute("x", tx);
                label.setAttribute("y", ty);
                label.setAttribute("transform", `rotate(${mid} ${tx} ${ty})`);
                label.setAttribute("text-anchor", "middle");
                label.setAttribute("dominant-baseline", "middle");
                label.setAttribute("fill", "white");
                label.setAttribute("font-size", "11");
                label.setAttribute("pointer-events", "none");
                label.textContent = num;
                wheelGroup.appendChild(label);
            });
        }

        function placeBet() {
            if (spinning) return;

            const amount = Math.floor(Number(betInput.value));
            const hasPocketBet = selectedPocket !== null;
            const hasColorBet = selectedColor !== null;

            if (!hasPocketBet && !hasColorBet) {
                rouletteMSG.textContent = "click a pocket or color first";
                return;
            }
            if (!amount || amount < 1) {
                rouletteMSG.textContent = "enter a bet amount";
                return;
            }
            if (amount > count) {
                rouletteMSG.textContent = "not enough clicks";
                return;
            }

            count -= amount;
            updateCount();
            spinning = true;
            rouletteMSG.textContent = "Spinning...";

            const winIndex = Math.floor(Math.random() * ORDER.length);
            const winNum = ORDER[winIndex];
            const winIsRed = REDS.includes(winNum);
            const winIsGreen = winNum === 0;
            const wheelAngle = (360 - (winIndex * STEP + STEP / 2)) % 360;
            wheelRot += 6* 360 + wheelAngle + (360 - (wheelRot % 360));
            wheelGroup.style.transform = "rotate(" + wheelRot + "deg)";

            setTimeout(() => {
                let won = false;
                let payout = 0;

                if (hasPocketBet && winNum === selectedPocket) {
                    won = true;
                    payout = amount * 35;
                } else if (hasColorBet) {
                    if (selectedColor === "red" && winIsRed) {
                        won = true;
                        payout = amount * 2;
                    } else if (selectedColor === "black" && !winIsRed && !winIsGreen) {
                        won = true;
                        payout = amount * 2;
                    } else if (selectedColor === "green" && winIsGreen) {
                        won = true;
                        payout = amount * 14;
                    }
                }

                if (won) {
                    count += payout;
                    rouletteMSG.textContent = "You won " + payout + " clicks! Winning number: " + winNum;
                } else {
                    rouletteMSG.textContent = "You lost. Winning number: " + winNum;
                }

                selectedPocket = null;
                selectedColor = null;
                document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
                document.querySelectorAll(".pocket").forEach(p => p.classList.remove("selected"));
                document.getElementById("selectedText").textContent = "Click a pocket to pick it";
                spinning = false;
                updateCount();
            }, 4200);
        }

        document.getElementById("rouletteMini").addEventListener("click", function () {
            document.getElementById("coinPanel").style.display = "none";
            document.getElementById("roulettePanel").style.display = "block";
            this.style.display = "none";
        });

        document.getElementById("rouletteClose").addEventListener("click", function () {
            document.getElementById("roulettePanel").style.display = "none";
            document.getElementById("rouletteMini").style.display = "block";
        });

        document.getElementById("wheelCenter").addEventListener("click", placeBet);
        document.getElementById("betMax").addEventListener("click", function () {
            betInput.value = count;
        });

        document.querySelectorAll("[data-add]").forEach(btn => {
            btn.addEventListener("click", function () {
                betInput.value = Math.min(count, Number(betInput.value || 0) + Number(this.dataset.add));
            });
        });

        document.querySelectorAll("[data-color]").forEach(btn => {
            btn.addEventListener("click", function () {
                if (spinning) return;
                document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
                document.querySelectorAll(".pocket").forEach(p => p.classList.remove("selected"));
                selectedPocket = null;

                if(selectedColor === btn.dataset.color){
                    selectedColor = null;
                    document.getElementById("selectedText").textContent = "Click a pocket to pick it";
                } else {
                selectedColor = btn.dataset.color;
                btn.classList.add("active");
                document.getElementById("selectedText").textContent = "Selected: " + selectedColor;
                
                }
            });
        });

        document.getElementById("coinMini").addEventListener("click", function () {
            document.getElementById("roulettePanel").style.display = "none";
            document.getElementById("rouletteMini").style.display = "block";
            document.getElementById("coinPanel").style.display = "block";
        });

        document.getElementById("coinClose").addEventListener("click", function () {
            document.getElementById("coinPanel").style.display = "none";
        });

        document.querySelectorAll("[data-side]").forEach(btn => {
            btn.addEventListener("click", function () {
                if (coinFlipping) return;
                document.querySelectorAll("[data-side]").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                coinSide = btn.dataset.side;
            });
        });

        document.getElementById("coinFlip").addEventListener("click", function (){
            if (coinFlipping) return;

            const bet = Math.floor(Number(document.getElementById("coinBet").value));
            const msg = document.getElementById("coinMsg");
            const coin = document.getElementById("coin");

            if (coinSide === null) { msg.textContent = "pick brain or skull first"; return;}
            if (!bet || bet < 1) { msg.textContent = "enter a bet amount"; return;}
            if (bet > count) {msg.textContent = "not enough clicks"; return;}

            count -= bet;
            updateCount();
            coinFlipping = true;
            lastWin = 0;
            document.getElementById("coinDouble").style.display = "none";
            msg.textContent = "Flipping...";
            coin.textContent = "🪙";

            coin.animate(
                [{ transform: "rotateY(0deg)" }, { transform: "rotateY(1800deg)"}],
                { duration: 1000, easing: "ease-out" }
            );

            const result = Math.random() <BRAIN_CHANCE ? "brain" : "skull";

            setTimeout(function() {
                coin.textContent = result === "brain" ? "🧠" : "💀";
                
                if (result === coinSide) {
                    count += bet * 2;
                    lastWin = bet *2;
                    document.getElementById("coinDouble").style.display = "inline-block";
                    msg.textContent = "it landed on " + result + " you win " + (bet * 2) + "! Double or nothing";
                } else {
                    msg.textContent = "it landed on " + result + " you lost! " + bet + ".";
                }
                updateCount();
                coinFlipping = false;
            }, 1000);
        });

        document.getElementById("coinDouble").addEventListener("click", function () {
            if (coinFlipping || lastWin < 1 ) return;

            const msg = document.getElementById("coinMsg");
            const coin = document.getElementById("coin");
            const stake = lastWin;

            if (stake > count) { msg.textContent = "not enough clicks"; return }

            count -= stake;
            updateCount();
            coinFlipping = true;
            lastWin = 0;
            this.style.display = "none";
            msg.textContent = "Double or nothing...";
            coin.textContent = "🪙";

            coin.animate(
                [{ transform: "rotateY(0deg)"}, { transform: "rotateY(1800deg)"}],
                {duration:1000, easing: "ease-out" }
            );
            const result = Math.random() < BRAIN_CHANCE ? "brain" : "skull";

            setTimeout(() => {
                coin.textContent = result === "brain" ? "🧠" : "💀";

                if (result === coinSide) {
                    count += stake * 2;
                    lastWin = stake * 2;
                    this.style.display = "inline-block";
                    msg.textContent = "Doubled! You now have " + (stake * 2) + " on the line. Again?";
                } else {
                    msg.textContent = "Nothing! You lost " + stake + ".";
                }
                updateCount();
                coinFlipping = false;
            }, 1000);
        });

        buildWheel();
        updateCount();
        add_autoclick();
        upgradetext();
</script>


</body>


</html>
