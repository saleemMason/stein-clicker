<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stein Clicker</title>

    <style>
        img{
            border-radius: 50;
        }
        
        body {
            background-color: black;
            color: green;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 { color: green; }
        p  { font-style: italic; color: green; }

        #clicker {
            cursor: pointer;
            padding: 0;
            background: none;
            border: none;
            transition: transform 0.1s ease;
        }

        #clicker img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            max-width: 80vw;
            display: block;
            border-radius: 50%;
            transition: transform 0.4s ease;
        }


        #clicker:focus-visible { outline: 3px solid green; outline-offset: 6px; }

        #count {
            font-size: 5rem;
            margin: 0.5rem 0;
        }

        #upgrade {
            background-color: black;
            color: lime;
            border: 2px solid green;
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #upgrade:hover{
            background-color: darkgreen;
        }


        #autoclick {
            background-color: black;
            color:lime;
            border:2px solid green;
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #autoclick:hover{
            background-color: darkgreen;
        }

        .brain{
            position:fixed;
            font-size: 32px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: float-up 0.8s ease-out forwards;
        }

        #rouletteMini{
            position:fixed;
            right: 20px;
            top: 40px;
            background:none;
            border: 2px solid green;
            border-radius: 50%;
            cursor:pointer;
            padding: 8px;
        }

        #roulettePanel {
            display: none;
            position: fixed;
            right: 10px;
            top: 10px;
            width: 50px;
            max-width: 95vw;
            background-color: black;
            border: 2px solid green;
            padding: 10px;
            z-index: 5000;
        }

        #rouletterPanel input {
            width: 90px;
            background:black;
            color:lime;
            border: 2px solid green;
            padding: 6px;
            font-size: 16px;
        }

        #roulettePanel button{
            background: black;
            color:lime;
            border: 2px solid green;
            padding: 6px 10px;
            cursor: pointer;
        }

        #rouletterPanel button:hover { background-color: darkgreen; }

        #wheelGroup {
            transform-origin: 0 0;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pocket{ cursor: pointer; stroke: #222; stroke-width: 1 ; }
        .pocket.selected { stroke: yellow; stroke-width: 4; }

    @keyframes float-up {
        from{ opacity: 1; margin-top: 0; }
        to {opacity: 0; margin-top: -60px; }
    }

    </style>
</head>

<body>
    <h1>Stein clicker</h1>

    <p id="count">0</p>
    <p>clicks</p>

    <!--upgrade button-->
    <button id="upgrade" onclick="buyUpgrade()">get 2x the clicks</button>
    <button id="autoclick" onclick="buy_autoclick()">Autoclicker</button>
    <p id="message"></p>

    <!--this is the einstein you click-->
    <button id="clicker" onclick="increaseCount(); spinElement();">
        <img id="einstein" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNXnNsd6HAjRGAHc33PpnQC7LfZFjI4N6OiV8tvGcMBA&s">
    </button>    
    
    <button id="rouletteMini">
        <img src="https://media.istockphoto.com/id/485660878/vector/sport-illustration.jpg?s=612x612&w=0&k=20&c=u7WciQuhqrutwio8ZeIquSiyZ1vHZhhyb0qeUb2D4A4=">
    </button>
    
    <script>
        let rotation = 0;
        let count = 0;
        let clickPower = 1;
        let upgradeCost = 50;
        let autocost = 10;
        let autoclickers = 0;
        const clicker = document.getElementById("clicker");
        


        function increaseCount() {
            count += clickPower;
            updateCount();
        }

        function upgradetext() {
            document.getElementById("upgrade").textContent =
                    "Buy 2x Clicks (Cost: " + upgradeCost + " clicks)";
        }

        function buyUpgrade() {
            if (count >= upgradeCost) {
                count -= upgradeCost;
                clickPower *= 2;
                upgradeCost *= 2;
                upgradetext()

                document.getElementById("message").textContent =
                    "Upgrade purchased! Each click earns " + clickPower + "!";
            } else {
                document.getElementById("message").textContent =
                    "Not enough clicks! Keep clicking Einstein!";
            }

            updateCount();
        }

        function updateCount() {
            document.getElementById("count").textContent = count;
        }

        function spinElement() {
            rotation += 360;
            console.log("Spinning big e")
            document.getElementById("einstein").style.transform = "rotate(" + rotation + "deg)";
        }

        function add_autoclick(){
            document.getElementById("autoclick").textContent = 
                "Buy auto Click (cost: " + autocost + " clicks)";
        }

        function buy_autoclick(){
            if (count >= autocost){
                count -= autocost;
                autoclickers++;
                autocost = Math.floor(autocost * 1.15);
                updateCount()
                add_autoclick();
            } else {
                document.getElementById("message").textContent = "Not enough clicks";
            }
        }

        function beat(){
            const img = document.getElementById("clicker");
            img.style.transform = "scale(.9)";
            setTimeout(() => {
                img.style.transform = "scale(1)";
            }, 100);
        }

        setInterval(function(){ 
            if(autoclickers > 0){
                count += autoclickers;
                updateCount();
                beat();
            }
        }, 1000);

        function spawnBrain(){
            const r = clicker.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;

            const angle = Math.random() * Math.PI * 2;
            const distance = 120 + Math.random() * 80;

            const brain = document.createElement("div");
            brain.className = "brain";
            brain.textContent = "🧠";
            brain.style.left = (cx + Math.cos(angle) * distance) + "px";
            brain.style.top = (cy + Math.sin(angle) * distance) + "px";
            document.body.appendChild(brain);
            setTimeout(() => brain.remove(), 900);
        }

        clicker.addEventListener("click", function(){
            increaseCount();
            spinElement();
            spawnBrain();
        });

        updateCount()
        add_autoclick()
        upgradetext()
</script>


</body>


</html>
